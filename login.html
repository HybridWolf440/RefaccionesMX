<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoParts MX — Iniciar Sesión / Registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden;padding:24px;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:50px 50px;opacity:.4;animation:gridPan 20s linear infinite;pointer-events:none;}
    body::after{content:'';position:fixed;width:600px;height:600px;background:radial-gradient(circle, rgba(232,80,10,.18) 0%, transparent 70%);top:-100px;right:-100px;pointer-events:none;}
    .auth-card{position:relative;z-index:2;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:48px 40px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;}
    .auth-logo{font-family:var(--font-disp);font-size:2.4rem;letter-spacing:.04em;line-height:1;margin-bottom:6px;}
    .auth-logo span{color:var(--accent);}
    .auth-subtitle{color:var(--muted);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:30px;}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
    .auth-tab{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:12px 16px;border-radius:var(--radius);font-family:var(--font-disp);font-size:1rem;letter-spacing:.12em;}
    .auth-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .auth-panel{display:none;}
    .auth-panel.active{display:block;}
    .form-group{margin-bottom:18px;}
    .form-group label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .form-group input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:.95rem;padding:12px 16px;outline:none;transition:border-color var(--trans);}
    .form-group input:focus{border-color:var(--accent);}
    .auth-btn{width:100%;background:var(--accent);color:#fff;font-family:var(--font-disp);font-size:1.1rem;letter-spacing:.14em;padding:14px;border-radius:var(--radius);transition:background var(--trans),transform var(--trans);margin-top:8px;}
    .auth-btn:hover{background:#c93d00;transform:translateY(-2px);}
    .auth-message{border-radius:var(--radius);padding:10px 14px;font-size:.85rem;margin-top:14px;display:none;}
    .auth-message.error{background:rgba(232,80,10,.12);border:1px solid rgba(232,80,10,.3);color:var(--accent2);}
    .auth-message.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;}
    .auth-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .auth-back{display:inline-flex;margin-top:24px;color:var(--muted);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;}
    .auth-back:hover{color:var(--accent);}
    @media(max-width:580px){.auth-card{padding:38px 22px;}.auth-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">AUTO<span>PARTS</span> MX</div>
    <div class="auth-subtitle">Acceso de usuarios y registro seguro</div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-panel="login-panel">Iniciar sesión</button>
      <button type="button" class="auth-tab" data-panel="register-panel">Registrarse</button>
    </div>

    <section class="auth-panel active" id="login-panel">
      <div class="form-group">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="correo@autoparts.mx" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="auth-btn" id="loginBtn">INGRESAR AL SISTEMA</button>
      <div class="auth-message error" id="login-error"></div>
      <div class="auth-message success" id="login-success"></div>
    </section>

    <section class="auth-panel" id="register-panel">
      <div class="auth-row">
        <div class="form-group">
          <label for="register-name">Nombre completo</label>
          <input type="text" id="register-name" placeholder="Tu nombre" autocomplete="name"/>
        </div>
        <div class="form-group">
          <label for="register-user">Usuario</label>
          <input type="text" id="register-user" placeholder="usuario" autocomplete="username"/>
        </div>
      </div>
      <div class="form-group">
        <label for="register-email">Correo electrónico</label>
        <input type="email" id="register-email" placeholder="correo@autoparts.mx" autocomplete="email"/>
      </div>
      <div class="auth-row">
        <div class="form-group">
          <label for="register-password">Contraseña</label>
          <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label for="register-password-confirm">Confirmar contraseña</label>
          <input type="password" id="register-password-confirm" placeholder="Repite tu contraseña" autocomplete="new-password"/>
        </div>
      </div>
      <button class="auth-btn" id="registerBtn">CREAR CUENTA</button>
      <div class="auth-message error" id="register-error"></div>
      <div class="auth-message success" id="register-success"></div>
    </section>

    <a href="index.html" class="auth-back">← Volver al sitio</a>
  </div>

  <script src="auth.js"></script>
  <script>
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.panel).classList.add('active');
      });
    });

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('registerBtn').addEventListener('click', handleRegister);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const registerPanel = document.getElementById('register-panel');
      if (registerPanel.classList.contains('active')) handleRegister();
      else handleLogin();
    });
  </script>
</body>
</html>
